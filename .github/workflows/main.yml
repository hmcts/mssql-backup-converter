on:
  push:
    branches:
      - main
    paths:
      - 'main/**'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'main/**'
      - '.github/workflows/main.yml'

name: Build and Publish images

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate build ID
        id: prep
        run: |
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          echo "::set-output name=BUILD_ID::${sha}-${ts}"

      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: b354d443-d632-4d61-8ee8-2abc2c7baf23 # DTS Shared GitHub Actions ACR Publisher 1
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
          allow-no-subscriptions: true

      - name: 'ACR Login'
        run: |
          az acr login --name hmctsprod

      # HMCTSPROD ACR
      - name: 'Build and push PR image'
        if: startsWith(github.ref, 'refs/pull')
        run: |
          docker build . -t hmctsprod.azurecr.io/hmcts/mssql-backup-converter:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}
          docker push hmctsprod.azurecr.io/hmcts/mssql-backup-converter:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}

      - name: 'Build and push prod image'
        if: github.ref == 'refs/heads/main'
        run: |
          docker build . -t hmctsprod.azurecr.io/hmcts/mssql-backup-converter:prod-${{ steps.prep.outputs.BUILD_ID }}-${{ steps.get-timestamp.outputs.timestamp }}
          docker push hmctsprod.azurecr.io/hmcts/mssql-backup-converter:prod-${{ steps.prep.outputs.BUILD_ID }}
          docker push hmctsprod.azurecr.io/hmcts/mssql-backup-converter:latest

      # HMCTSPUBLIC ACR - to be deprecated post migration to hmctsprod
      - name: 'Docker Login'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/hmcts/mssql-backup-converter:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/hmcts/mssql-backup-converter:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}
        if: startsWith(github.ref, 'refs/pull')
        name: 'Build and publish PR image'
      - run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/hmcts/mssql-backup-converter:prod-${{ steps.prep.outputs.BUILD_ID }} -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/hmcts/mssql-backup-converter:latest
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/hmcts/mssql-backup-converter:prod-${{ steps.prep.outputs.BUILD_ID }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/hmcts/mssql-backup-converter:latest
        if: github.ref == 'refs/heads/main'
        name: 'Build and publish production image'